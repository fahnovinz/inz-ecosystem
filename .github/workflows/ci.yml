name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported version, current LTS, and current release.
        node: ["18", "20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Lint (syntax)
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Verify CLI
        run: |
          node bin/inz.js help
          node bin/inz.js version
          node bin/inz.js products --json
          node bin/inz.js products --kind tool

      - name: Verify CLI exit codes
        run: |
          set +e
          node bin/inz.js definitely-not-a-command >/dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "Expected exit code 2 for an unknown command, got $code"
            exit 1
          fi

      - name: Upload coverage (lcov)
        if: always() && matrix.node == '20'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Audit (fail on high or critical)
        run: npm audit --audit-level=high
