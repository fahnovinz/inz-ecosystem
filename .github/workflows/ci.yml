name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dev dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Verify CLI
        run: |
          node bin/inz.js help
          node bin/inz.js version
          node bin/inz.js products --json

      - name: Syntax check
        run: |
          node --check bin/inz.js
          node --check src/github-stats.js
          node --check src/repo-health.js
          node --check src/badges.js
          node --check src/github-api.js
          node --check src/products.js
          node --check src/report.js
          node --check src/utils.js

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
